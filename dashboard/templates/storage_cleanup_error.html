<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ error_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='storage.css') }}">
</head>
<body class="error-page">
    <main class="shell error-shell">
        <section class="panel error-panel" aria-labelledby="error-heading">
            <p class="eyebrow">Guided cleanup stopped safely · {{ status_code }}</p>
            <h1 id="error-heading">{{ error_title }}</h1>
            <p>{{ error_detail }}</p>
            <p><strong>No unreviewed permanent-deletion fallback was used.</strong></p>
            <a href="{{ url_for('dashboard') }}">← Return to the dashboard</a>
        </section>
    </main>
</body>
</html>
